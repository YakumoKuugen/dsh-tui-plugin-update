<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="icon-title icon-desc">
  <title id="icon-title">dsh-tui-plugin-update</title>
  <desc id="icon-desc">A white circular update arrow on a blue rounded tile.</desc>
  <!-- Same canvas and tile geometry as the other dsh plugin artwork: a 28x28
       tile inset by 4 on a 36x36 canvas, radius 8, shrunk to 26/28 around the
       centre so the consumer's `size` attribute stays in charge. The blue
       vertical gradient (#69B9FF -> #324DE2) is the shared plugin fill.

       The mark is a clockwise refresh arc: radius 7 around (18,18), from 300°
       round through the bottom to 240°, leaving a 60° gap at the top. The
       arrowhead sits at the 240° end, pointing along the tangent (up and to
       the right) into that gap, so it reads as "update" at 16px. -->
  <g transform="translate(18 18) scale(0.9286) translate(-18 -18)">
    <rect x="4" y="4" width="28" height="28" rx="8" fill="url(#update_blue)"/>
    <g stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M21.5 11.94A7 7 0 1 1 14.5 11.94"/>
      <path d="M12.83 15.44 14.5 11.94 10.63 11.63"/>
    </g>
  </g>
  <defs>
    <linearGradient id="update_blue" x1="18" y1="4" x2="18" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69B9FF"/>
      <stop offset="1" stop-color="#324DE2"/>
    </linearGradient>
  </defs>
</svg>
